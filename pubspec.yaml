name: theme_reveal_kit
description: Persistent Flutter light, dark and system themes with circular, vector and alpha-mask reveals over a live application.
version: 0.1.1
repository: https://github.com/Ahmedelsapagh10/theme_reveal
issue_tracker: https://github.com/Ahmedelsapagh10/theme_reveal/issues
homepage: https://elsapagh.octopusteam.net/

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Real macOS circular reveal from the Settings button, dark to light and back.
    path: doc/media/hero.gif
  - description: The compact theme button inside the actual Settings tab layout.
    path: doc/media/settings_tab.png
  - description: Rich Home tab content in the real light theme.
    path: doc/media/home_light.png
  - description: The same live Home tab in dark mode.
    path: doc/media/home_dark.png

topics:
  - theme
  - dark-mode
  - animation
  - widgets
  - persistence

flutter:
  uses-material-design: true
