name: theme_reveal_kit_example
description: "Minimal circular theme reveal and persistence example."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.6

  theme_reveal_kit:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/logo.png
    - assets/custom_shape.json
